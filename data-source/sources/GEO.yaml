country: Georgia
iso3: GEO
updated: 2026-06

sources:

  - id: gnerc_market_review
    name: GNERC Annual Market Review
    description: Annual electricity market statistics including imports, exports, transit (GWh)
    provider: Georgian National Energy and Water Supply Regulatory Commission (GNERC)
    url: https://gnerc.org/en/statistical-information/annual-market-review/
    access: Manual download — PDF annual reports, data manually extracted
    raw_file: null
    coverage: 2019–2025
    notes: >
      Primary source for cross-border flows. Physical border points named
      (e.g. "Russia (Kavkasioni)", "Turkey (BSTN)", "Armenia (Alaverdi)").
    used_by: null  # geo_pipeline.py — Phase 3 (not yet implemented)

  - id: esco_balance
    name: ESCO Georgia — Annual Electricity Balance
    description: Annual electricity generation by fuel type (GWh), 2017–2025
    provider: ESCO (Electricity System Commercial Operator of Georgia)
    url: https://esco.ge/en/energy-balance/by-year-1
    access: >
      Automatic download via geo_pipeline.py.
      PDFs cached locally in data-source/raw/GEO/esco_energobalans_{year}.pdf
    raw_file: data-source/raw/GEO/esco_energobalans_{year}.pdf
    coverage: 2017–2025
    notes: >
      PDFs contain 14-column tables (Name | Jan–Dec | Annual), units = GWh.
      Old format (2017-2021): space as thousands separator.
      New format (2022+): comma as thousands separator.
      Fuel categories: Total Thermal (all gas) · Kartli Wind · Regulatory HPPs · Seasonal HPPs · Small power HPPs.
      Capacity data (MW) not available from this source.
    used_by: tools/pipelines/geo_pipeline.py → public/data/supply/GEO.json

  - id: geo_trade_csv
    name: Compiled Georgia cross-border flows CSV
    description: Annual imports, exports and transit flows by partner (GWh), 2019–2025
    provider: GNERC Annual Market Reviews + GSE
    url: null
    access: Manually compiled tidy CSV (in EPM Data/Georgia folder)
    raw_file: null  # Not yet committed to data-source/raw/GEO/
    coverage: 2019–2025
    notes: >
      Transit flows (AZ→TR, RU→TR, AM→TR) tracked separately.
      trade/GEO.json pre-generated; geo_pipeline.py handles supply only.
    used_by: public/data/trade/GEO.json (pre-generated)

  - id: tyndp2022_capacity
    name: World Bank Power Sector Data Repository — Installed Capacity (TYNDP 2022 basis)
    description: Annual installed capacity by technology (MW), 2015–2021
    provider: GSE / World Bank ESMAP — data aligned with ENTSO-E TYNDP 2022
    url: null
    access: Excel file received from World Bank Georgia team
    raw_file: data-source/raw/GEO/tyndp2022_capacity.xlsx
    coverage: 2015–2021 (official); 2022–2025 estimated in pipeline
    notes: >
      Sheet "Installed Capacity". Categories: Reservoir Hydro, Daily Regulation Hydro,
      Run-of-River, Run-of-River (Small), Thermal (all gas in Georgia), Wind.
      Aggregated in pipeline: Hydro Reservoir = Reservoir + Daily Regulation,
      Hydro RoR = Run-of-River + Small HPPs.
      2022-2025 extrapolated: RoR grows ~30-47 MW/year (GNERC Annual Report 2024
      confirms +47.5 MW HPPs commissioned in 2024). Thermal and reservoir stable.
    used_by: tools/pipelines/geo_pipeline.py -> public/data/supply/GEO.json

pipeline_status: implemented  # Phase 3 complete — generation (ESCO PDFs) + capacity (TYNDP xlsx)
