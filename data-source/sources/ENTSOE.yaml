datasets:
  - id: A75
    name: Actual Generation per Production Type
    unit: GWh
    notes: >
      Hourly or 15-min MW values, summed to annual GWh per production type.
      MultiIndex columns (Actual Aggregated / Actual Consumption) — only
      Actual Aggregated is kept. Negative pump-storage consumption clipped to 0.
    used_for: generation section in supply JSON

  - id: A68
    name: Installed Generation Capacity Aggregated
    unit: MW
    notes: >
      Annual snapshots per production type. Last snapshot per year used.
      For countries with multiple bidding zones (DE=DE_LU, IT=IT_NORD,
      DK=DK_1, NO=NO_1, SE=SE_3), zone-level data is used as proxy.
    used_for: capacity section in supply JSON

  - id: A65
    name: Actual Total Load
    unit: GWh
    notes: >
      Hourly or 15-min MW values, summed to annual GWh.
      Used as demand line in generation section.
    used_for: demand array in generation section

